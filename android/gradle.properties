org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# GitHub Actions' runners currently pull in Android Gradle Plugin 9+,
# which reads project Gradle files in a new strict DSL mode this
# project's build.gradle files don't use yet. Opting out keeps the
# classic (Groovy) DSL parsing that this project is written in.
android.newDsl=false
